<body>

<div class="card">
    <h2>Форма информации о студенте</h2>

    <form th:action="@{/form}" th:object="${student}" method="post">
        <div class="row">
            <label>ID студента:</label>
            <input type="number" th:field="*{id}" required />
        </div>

        <div class="row">
            <label>Фамилия:</label>
            <input type="text" th:field="*{lastName}" required />
        </div>

        <div class="row">
            <label>Имя:</label>
            <input type="text" th:field="*{firstName}" required />
        </div>

        <div class="row">
            <label>Отчество:</label>
            <input type="text" th:field="*{middleName}" />
        </div>

        <div class="row">
            <label>E-mail:</label>
            <input type="email" th:field="*{email}" required />
        </div>

        <div class="row">
            <label>Год поступления:</label>
            <input type="number" th:field="*{admissionYear}" placeholder="например: 2024" required />
        </div>

        <div class="row">
            <input type="submit" value="Отправить данные" />
        </div>
    </form>
</div>

</body>
