<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Информация о студенте</title>
    <link rel="stylesheet" th:href="@{/css/result-style.css}">

<body>

<div class="card">
    <h2>Результаты регистрации</h2>
    <p><b>ID:</b> <span th:text="${student.id}"></span></p>
    <p><b>ФИО:</b> <span th:text="${student.lastName + ' ' + student.firstName + ' ' + student.middleName}"></span></p>
    <p><b>E-mail:</b> <span th:text="${student.email}"></span></p>
    <p><b>Год поступления:</b> <span th:text="${student.admissionYear}"></span></p>
    <hr>
    <p><b>Группа:</b> <span class="badge" th:text="${student.group}"></span></p>
    <p><b>Логин портала:</b> <span class="badge" th:text="${student.login}"></span></p>
    <br>
    <a th:href="@{/form}">Ввести новую информацию</a>
</div>

</body>
</html>
